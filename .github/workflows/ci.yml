name: CI

on:
  push:
    branches: [main, full-spec-implementation]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run qa:audit
      - run: npm run lint
      - run: npm run qa:static
      - run: npm run typecheck:core
      - run: npm run test:core
      - run: npm run typecheck
      - run: npm run build
      - name: Verify live database contract when CI secret is configured
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: npm run qa:db
      - name: Verify cross-user RLS and private storage when Supabase CI credentials are configured
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' && env.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          ALLOW_RLS_TESTS: "true"
        run: npm run qa:rls
