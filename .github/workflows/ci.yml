name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check scripts/career-feature-qa.mjs
      - run: npm run typecheck:core
      - run: npm run test:core
      - run: node --test tests/occupation-mapping.test.mjs
      - run: node --test tests/taxonomy-extension.test.mjs
      - run: node scripts/occupation-mapping-review.mjs validate
      - run: node scripts/export-reviewed-occupation-crosswalk.mjs > /dev/null
      - run: npm run qa:contracts
      - run: node --test tests/occupation-snapshot.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/career-auth-guard-smoke.mjs
