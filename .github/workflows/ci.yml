name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check scripts/career-feature-qa.mjs
      - run: npm run typecheck:core
      - run: npm run test:core
      - run: node --test tests/assessment-replay.test.mjs
      - run: node --test tests/assessment-scoring-guardrails.test.mjs
      - run: node --test tests/evidence-a3-competency.test.mjs
      - run: node --test tests/evidence-a3-real-assessment.test.mjs
      - run: node --test tests/evidence-a3-practical-review.test.mjs
      - run: node --check scripts/evidence-a3-auth-staging-qa.mjs
      - run: node --test tests/evidence-a3-staging-guard.test.mjs
      - run: node --test tests/scoring-evidence-gap-integration.test.mjs
      - run: node --check scripts/scoring-a2-staging-auth-qa.mjs
      - run: node --test tests/scoring-staging-guard.test.mjs
      - run: node --test tests/twin-challenge.test.mjs
      - run: node --test tests/journey-agent.test.mjs
      - run: node --test tests/agent-action-guard.test.mjs
      - run: node --test tests/agent-read-tools.test.mjs
      - run: node --test tests/agent-thread-history.test.mjs
      - run: node --test tests/agent-phase4-evaluation.test.mjs
      - run: node --test tests/agent-release-readiness.test.mjs
      - run: node --test tests/certification-recommendations.test.mjs
      - run: node --import tsx --test tests/curated-learning-resources.test.mjs
      - run: node --test tests/certification-journey.test.mjs
      - run: node --test tests/certification-preparation.test.mjs
      - run: node --test tests/arena-duel.test.mjs
      - run: node --test tests/arena-ai-fallback.test.mjs
      - run: node --test tests/orbit-preview.test.mjs
      - run: node --test tests/project-defense.test.mjs
      - run: node --test tests/judge-demo-integrity.test.mjs
      - run: node --test tests/assessment-bank-boundary.test.mjs
      - run: node --test tests/occupation-mapping.test.mjs
      - run: node --test tests/reviewed-career-model.test.mjs
      - run: node scripts/reviewed-career-models.mjs status > /dev/null
      - run: node --test tests/taxonomy-extension.test.mjs
      - run: node scripts/occupation-mapping-review.mjs validate
      - run: node scripts/export-reviewed-occupation-crosswalk.mjs > /dev/null
      - run: npm run qa:contracts
      - run: node --test tests/occupation-snapshot.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/career-auth-guard-smoke.mjs
      - name: Verify standalone runtime and Docker image
        run: |
          test -f .next/standalone/server.js
          docker build --progress plain -t skilltwin-standalone-qa .
          docker image inspect skilltwin-standalone-qa --format '{{.Size}}'

