name: Focus Mode Extension QA
on:
  push:
    paths:
      - 'extensions/chrome-focus-demo/**'
      - 'docs/FOCUS_MODE_90_MINUTE_IMPLEMENTATION_PLAN.md'
      - '.github/workflows/focus-demo.yml'
  pull_request:
    paths:
      - 'extensions/chrome-focus-demo/**'
      - 'docs/FOCUS_MODE_90_MINUTE_IMPLEMENTATION_PLAN.md'
      - '.github/workflows/focus-demo.yml'
jobs:
  focus-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: extensions/chrome-focus-demo
      - run: npm run check
        working-directory: extensions/chrome-focus-demo
      - run: node -e 'const m=require("./extensions/chrome-focus-demo/manifest.json"); if(m.manifest_version!==3||!m.background?.service_worker||!m.web_accessible_resources?.some(r=>r.resources.includes("blocked.html"))) process.exit(1);'
      - name: Package Chrome Web Store upload ZIP
        run: |
          cd extensions/chrome-focus-demo
          zip -q -9 ../../SkillTwin_Focus_0.1.1_Chrome_Web_Store.zip manifest.json background.js blocked.html blocked.js core.mjs questions.mjs popup.html popup.js styles.css icon-128.png
      - name: Publish downloadable QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: skilltwin-focus-0.1.1-store-package
          path: SkillTwin_Focus_0.1.1_Chrome_Web_Store.zip
          retention-days: 90
